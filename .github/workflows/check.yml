name: App checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --include=dev
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: verified-build
          path: |
            package-lock.json
            dist
          retention-days: 7
  sites:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --include=dev
      - run: npm run db:generate
      - run: git diff --exit-code -- drizzle
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:worker
      - name: Verify standalone Sites source
        run: |
          node ../scripts/export-sites.mjs
          cd ../.sites-export/gameforge
          node scripts/prepare-ui.mjs
          ln -s ../../sites/node_modules node_modules
          npm run typecheck
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sites-build
          path: |
            sites/package-lock.json
            sites/drizzle
            sites/dist
          retention-days: 7
