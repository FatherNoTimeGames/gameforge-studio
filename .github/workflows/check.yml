name: App checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --include=dev
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: verified-build
          path: |
            package-lock.json
            dist
          retention-days: 7
